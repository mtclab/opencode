name: build-cli

on:
  push:
    branches: [dev]
    paths:
      - "packages/opencode/**"
      - "packages/ui/**"
      - "packages/app/**"
      - "packages/core/**"
      - "packages/sdk/**"
      - ".github/workflows/build-cli.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: |
          ./packages/opencode/script/build.ts
        env:
          OPENCODE_VERSION: "1.15.13"
          OPENCODE_RELEASE: ""
          GH_REPO: mtclab/opencode
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-cli
          path: |
            packages/opencode/dist/opencode-linux*

      - name: Package release tarballs
        run: |
          mkdir -p /tmp/release
          for dir in packages/opencode/dist/opencode-linux-*; do
            name=$(basename "$dir")
            tar czf "/tmp/release/${name}.tar.gz" -C "$dir" .
          done

      - name: Update latest release
        run: |
          gh release delete latest --repo "$GH_REPO" --yes || true
          gh release create latest --repo "$GH_REPO" \
            --title "Latest ($OPENCODE_VERSION)" \
            --notes "Auto-built from dev branch. v$OPENCODE_VERSION + MCP subagent permission patch." \
            /tmp/release/*.tar.gz
        env:
          GH_REPO: mtclab/opencode
          OPENCODE_VERSION: "1.15.13"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
